    <style>
      /* Khung khởi động: bảo đảm trang không trống trong lúc tải JS */
      .boot {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #ffffff;
        color: #5b6474;
        font-family: 'Inter', system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .boot strong {
        font-family: 'Montserrat', system-ui, sans-serif;
        font-size: 26px;
        letter-spacing: 0.04em;
        color: #0a1a3c;
      }
      .boot span {
        font-size: 13px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .boot__bars {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      .boot__bars i {
        width: 6px;
        height: 26px;
        border-radius: 2px;
        transform: skewX(-24deg);
        animation: bootPulse 1.2s infinite ease-in-out;
      }
      .boot__bars i:nth-child(1) {
        background: #df2626;
      }
      .boot__bars i:nth-child(2) {
        background: #00a651;
        animation-delay: 0.15s;
      }
      .boot__bars i:nth-child(3) {
        background: #0057d9;
        animation-delay: 0.3s;
      }
      @keyframes bootPulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.25;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot__bars i {
          animation: none;
        }
      }
    </style>
    <noscript>
      <style>
